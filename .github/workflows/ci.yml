name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      - name: Test distribution
        run: npm run test:dist

      - name: Check npm package
        run: npm pack --dry-run

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  legacy-consumer:
    name: Vue ${{ matrix.vue }} consumer (${{ matrix.host }}) on Node 18
    strategy:
      matrix:
        vue: ['2.6.14', '2.7.16']
        host: [native, vuetify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack package
        run: npm pack

      - name: Set up consumer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install baseline consumer dependencies
        run: npm ci
        working-directory: tests/compatibility/vue-2.6

      - name: Install packed package and selected host
        run: |
          host_dependencies=()
          if [ "${{ matrix.host }}" = "vuetify" ]; then host_dependencies+=(vuetify@2.6.15); fi
          npm install --no-save --ignore-scripts ../../../vue2-smart-datatable-*.tgz vue@${{ matrix.vue }} vue-template-compiler@${{ matrix.vue }} "${host_dependencies[@]}"
        working-directory: tests/compatibility/vue-2.6

      - name: Run packed compatibility test
        run: npm test
        env:
          SDT_VUE_VERSION: ${{ matrix.vue }}
          SDT_WITH_VUETIFY: ${{ matrix.host == 'vuetify' && '1' || '0' }}
        working-directory: tests/compatibility/vue-2.6

  pages-build:
    name: Build demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, browser, legacy-consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo for GitHub Pages
        run: npm run build:demo
        env:
          SDT_DEMO_BASE: /vue2-smart-datatable/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo

  deploy:
    name: Deploy demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
