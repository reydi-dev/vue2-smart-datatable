name: Bug report
description: Report a reproducible defect in the table or its adapters.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not include secrets or private data.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: 0.1.0-rc.1 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Vue, Vuetify, browser, and Node.js versions where relevant.
      placeholder: Vue 2.7.16, Vuetify 2.6.15, Chrome 151, Node.js 20
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a small repository or provide the smallest reproducible configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or provider request/response shapes with sensitive values removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
